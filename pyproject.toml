[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-mcp"
version = "0.1.0"
description = "FastMCP server that traces agent runs and blocks PRs on prompt regressions"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "langchain-groq",
    "langchain-core",
    "pydantic",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
include = ["app*"]
